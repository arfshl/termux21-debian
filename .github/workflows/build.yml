name: "Build debian rootfs"

on:
  workflow_dispatch:

permissions:
  contents: write  

jobs:

  build-squeeze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64, i386]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Start Build!
        run: |
              ARCH=${{ matrix.arch }}
              case "$ARCH" in
              x86_64) ARCH=amd64 ;;
              amd64) ARCH=amd64 ;;
              aarch64) ARCH=arm64 ;;
              arm64) ARCH=arm64 ;;
              arm) ARCH=arm ;;
              i386) ARCH=386 ;;
              *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
              esac
              # Fetch image manifest
              manifest=$(docker manifest inspect debian:squeeze)
              # Fetch image digest
              arch="$ARCH"
              digest=$(echo "$manifest" | jq -r ".manifests[] | select(.platform.architecture == \"$arch\") | .digest")
              # Pull and Export image
              docker pull "debian:squeeze@${digest}"
              docker export $(docker create "debian:squeeze@${digest}") | xz -T 0 > "$GITHUB_WORKSPACE/debian-squeeze-${{ matrix.arch }}.tar.xz"

      - name: Push to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rootfs
          name: rootfs
          files: |
            debian-squeeze-*.tar.xz
          preserve_order: true

  build-squeeze-arm:
    runs-on: ubuntu-latest
    strategy:
