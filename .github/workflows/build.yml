              # Pull and Export image
              docker pull "debian:squeeze@${digest}"
              docker export $(docker create "debian:squeeze@${digest}") | xz -T 0 > "$GITHUB_WORKSPACE/debian-squeeze-${{ matrix.arch }}.tar.xz"

